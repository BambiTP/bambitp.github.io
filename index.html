<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BambiTP</title>
<meta name="description" content="TagPro clones, bots, userscripts, map tools, stats and spreadsheets by Bambi.">
<link rel="icon" type="image/png" href="img/favicon.png">
<style>
:root{
  --bg:#0f1115; --panel:#181b22; --panel2:#1f232c; --ink:#eceef2; --muted:#9aa3b2;
  --rule:#2a2f3a; --red:#e8453c; --blue:#3d7be0; --play:#cfe03a;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:inherit; text-decoration:none}
.wrap{max-width:1180px; margin:0 auto; padding:0 16px}

header{position:sticky; top:0; z-index:5; background:rgba(15,17,21,.94);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--rule)}
.top{display:flex; align-items:center; gap:14px; padding:14px 0 10px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto}
.brand img{width:44px; height:44px}
.brand h1{margin:0; font-size:22px; letter-spacing:-.01em}
.brand span{display:block; font-size:13px; color:var(--muted)}
#q{width:260px; max-width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--rule);
  background:var(--panel); color:var(--ink); font:inherit}
#q:focus{outline:2px solid var(--blue); outline-offset:-1px}
.tabs{display:flex; gap:6px; padding:0 0 12px; overflow-x:auto; scrollbar-width:none}
.tabs button{flex:none; border:1px solid var(--rule); background:var(--panel); color:var(--muted);
  padding:6px 13px; border-radius:99px; font:inherit; font-size:14px; cursor:pointer}
.tabs button b{font-weight:500; opacity:.6; margin-left:4px; font-size:12px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr)); gap:16px; padding:22px 0 40px}
.card{min-width:0; background:var(--panel); border:1px solid var(--rule); border-radius:12px; overflow:hidden;
  display:flex; flex-direction:column; transition:transform .12s, border-color .12s}
.card:hover{transform:translateY(-2px); border-color:#3a4150}
.pic{display:block; aspect-ratio:16/10; background:var(--panel2); position:relative; overflow:hidden}
.pic img{width:100%; height:100%; object-fit:cover; display:block}
.pic.gen{aspect-ratio:16/5; display:flex; align-items:flex-end; justify-content:flex-end; padding:0 14px 6px; font-size:34px}
.pic .cat{position:absolute; left:8px; top:8px; font-size:11px; letter-spacing:.05em; text-transform:uppercase;
  background:rgba(0,0,0,.6); color:#fff; padding:2px 8px; border-radius:99px}
.body{padding:12px 14px 14px; display:flex; flex-direction:column; gap:4px; flex:1}
.name{font-weight:650; font-size:15.5px}
.desc{color:var(--muted); font-size:13.5px}
.btns{display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:10px}
.btns a{font-size:13px; padding:5px 11px; border-radius:7px; background:var(--panel2); border:1px solid var(--rule)}
.btns a:hover{border-color:var(--muted)}
.btns a.main{background:var(--play); color:#111; border-color:var(--play); font-weight:650}
.empty{color:var(--muted); padding:40px 0; text-align:center; grid-column:1/-1}
footer{border-top:1px solid var(--rule); color:var(--muted); font-size:13px; padding:18px 0 30px}
footer a{color:var(--ink)}
@media (max-width:560px){ #q{width:100%} .grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px} .pic.gen{font-size:26px} .desc{font-size:12.5px} .btns a{padding:5px 8px} }
@media (max-width:360px){ .grid{grid-template-columns:minmax(0,1fr)} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="./"><img src="img/deer.png" alt=""><div><h1>BambiTP</h1><span>TagPro stuff I've made. All free, all in the browser.</span></div></a>
      <input id="q" type="search" placeholder="Search…" aria-label="Search projects">
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap"><div class="grid" id="grid"></div></main>

<footer><div class="wrap">Made by Bambi · <a href="https://github.com/BambiTP">GitHub</a></div></footer>

<script>
// To add a project: add one line below.
// cat: clones | bots | scripts | maps | stats | sheets.  img: file in img/ (optional).  links: [label, url], first is the main button.
const GH = 'https://github.com/BambiTP/', PG = 'https://bambitp.github.io/', GIST = 'https://gist.github.com/BambiTP/',
      SHEET = id => 'https://docs.google.com/spreadsheets/d/' + id;
const P = [
  // Clones
  {cat:'clones', name:'TagPro Offline', desc:'Single-player TagPro with bots. No server needed.', img:'offline', links:[['▶ Play', PG+'tagpro-offline/'], ['Code', GH+'tagpro-offline']]},
  {cat:'clones', name:'BamBall', desc:'Multiplayer TagPro engine with Gravity and Eggball modes.', img:'bamball', links:[['▶ Play', PG+'BamBall/'], ['Code', GH+'BamBall']]},
  {cat:'clones', name:'tagpro-local', desc:'The real TagPro client on a rebuilt server.', links:[['Code', GH+'tagpro-local']]},
  {cat:'clones', name:'TagproOpen', desc:'Modular rebuild that later engines grew from.', img:'tagproopen', links:[['▶ Play', PG+'TagproOpen/game.html'], ['Code', GH+'TagproOpen']]},
  {cat:'clones', name:'Tagpro Next', desc:'The first rebuild, with a bot to play against.', img:'tagpronext', links:[['▶ Play', PG+'Tagpro-Next/'], ['Code', GH+'Tagpro-Next']]},
  {cat:'clones', name:'Blitz Arena', desc:'Portals, boosts and gravity wells sandbox.', links:[['▶ Play', PG+'BlitzArena/'], ['Code', GH+'BlitzArena']]},
  {cat:'clones', name:'Replay Viewer', desc:'Plays a recorded match back through the physics.', links:[['Open', PG+'TagproReplay/'], ['Code', GH+'TagproReplay']]},

  // Bots
  {cat:'bots', name:'tagproAI', desc:'A bot that plans by searching the real engine.', links:[['Code', GH+'tagproAI']]},
  {cat:'bots', name:'tpbot', desc:'Puts the ball exactly on a target, as fast as possible.', links:[['Code', GH+'tpbot']]},

  // Userscripts
  {cat:'scripts', name:'Expected Caps Overlay', desc:'Shows each team’s expected caps while watching a replay.', links:[['Install', 'https://raw.githubusercontent.com/BambiTP/tagpro-findings/master/userscript/tagpro-xcaps.user.js'], ['Code', GH+'tagpro-findings/tree/master/userscript']]},
  {cat:'scripts', name:'Minimap Advanced', desc:'Full-size minimap with live players.', links:[['Install', GIST+'141ce5ed4227723062c8e67026c6f39d/raw/TagproMiniMapyAdvanced.user.js'], ['Code', GIST+'141ce5ed4227723062c8e67026c6f39d']]},
  {cat:'scripts', name:'Ranked Stats', desc:'Your ranked stats per player, from your replays page.', links:[['Install', GIST+'7f2a497c3ecdca061c97c4feae9cc4a6/raw/RankedStats.user.js'], ['Code', GIST+'7f2a497c3ecdca061c97c4feae9cc4a6']]},
  {cat:'scripts', name:'Match Data Fetcher', desc:'Downloads your ranked match data as JSON.', links:[['Install', GIST+'fa68695fe38b482bceb942f2502c7bee/raw/fetchstats.user.js'], ['Code', GIST+'fa68695fe38b482bceb942f2502c7bee']]},
  {cat:'scripts', name:'Skill Graph', desc:'Graph of a player’s skill rating on their profile.', links:[['Install', GIST+'fd9e3cadacb7a1695eb149c342f96aaf/raw/skillGraph.user.js'], ['Code', GIST+'fd9e3cadacb7a1695eb149c342f96aaf']]},
  {cat:'scripts', name:'Auto Switch Teams', desc:'Evens the teams for you when someone joins or leaves.', links:[['Install', GIST+'b7b41416938f578d3d376fdb85e138b6/raw/AutoTeamSwitch.user.js'], ['Code', GIST+'b7b41416938f578d3d376fdb85e138b6']]},
  {cat:'scripts', name:'Team Switch Macro', desc:'Switch teams with one key.', links:[['Install', GIST+'2540e15d3df53491c8d603f8c84eb7d0/raw/SwitchMacro.user.js'], ['Code', GIST+'2540e15d3df53491c8d603f8c84eb7d0']]},
  {cat:'scripts', name:'Ranked Voice Chat', desc:'Puts ranked teams into a voice room.', links:[['Install', GIST+'edb6877fcb068e11ce58cdbebece9c48/raw/RankedVoice.user.js'], ['Code', GIST+'edb6877fcb068e11ce58cdbebece9c48']]},
  {cat:'scripts', name:'Zomball', desc:'Runs the Zomball game mode in a group.', links:[['Install', GIST+'d9d1230fdd8b319f3410fb46738b0de9/raw/zomball.user.js'], ['Code', GIST+'d9d1230fdd8b319f3410fb46738b0de9']]},
  {cat:'scripts', name:'Zombies & Spiderman', desc:'Zomball textures: blue team plays as zombies.', links:[['Install', GIST+'55c54d028e5e0b0ef768c597e4605b02/raw/ZomballTextures.user.js'], ['Code', GIST+'55c54d028e5e0b0ef768c597e4605b02']]},
  {cat:'scripts', name:'EggPro', desc:'Small fixes for Egg Ball.', links:[['Install', GIST+'6c28fb4371b6102c845a3e0c92ec8737/raw/EggPro.user.js'], ['Code', GIST+'6c28fb4371b6102c845a3e0c92ec8737']]},
  {cat:'scripts', name:'Disable Reports', desc:'Stops the report page opening on a kick.', links:[['Install', GIST+'5802103f397c4b47cbc374ea0db7d35e/raw/NoReport.user.js'], ['Code', GIST+'5802103f397c4b47cbc374ea0db7d35e']]},
  {cat:'scripts', name:'Replace Map Select', desc:'Replaces the group map-selection list.', links:[['Install', 'https://raw.githubusercontent.com/BambiTP/ReplaceMapSelection/main/Replace%20Map%20Select-0.4.user.js'], ['Code', GH+'ReplaceMapSelection']]},

  // Map tools
  {cat:'maps', name:'StraTAGy', desc:'Draw plays over any Fortunate Maps map.', img:'stratagy', links:[['Open', PG+'StraTAGy/'], ['Userscript', 'https://greasyfork.org/en/scripts/467747-fortunate-maps-stratagy'], ['Code', GH+'StraTAGy']]},
  {cat:'maps', name:'Map Preview', desc:'See a Fortunate Maps map in any texture pack.', img:'mappreview', links:[['Open', PG+'MapPreview/'], ['Code', GH+'MapPreview']]},
  {cat:'maps', name:'Live Map Editor', desc:'Edit a map while you play on it.', img:'liveeditor', links:[['Open', PG+'TagproLiveEditor/'], ['Code', GH+'TagproLiveEditor']]},
  {cat:'maps', name:'Custom Textures', desc:'Retexture map tiles and export the pack.', img:'customtextures', links:[['Open', PG+'CustomTextures/'], ['Userscript', 'https://greasyfork.org/en/scripts/526517-tagpro-custom-map-tiles-anchored-pixi-overlay-editor'], ['Packs', GH+'texturepacks']]},
  {cat:'maps', name:'Image to Map', desc:'Turn any image into a TagPro map.', img:'imagetomap', links:[['Open', PG+'Image-To-Map-Tagpro/'], ['Code', GH+'Image-To-Map-Tagpro']]},
  {cat:'maps', name:'Wall Generator', desc:'Generate map walls from a few sliders.', img:'wallgen', links:[['Open', PG+'BuildAMapWorkshop/'], ['Code', GH+'BuildAMapWorkshop']]},
  {cat:'maps', name:'Maps Stitcher', desc:'Lay map screenshots in a grid, save as one PNG.', links:[['Open', PG+'FortunateMapsStitcher/'], ['Code', GH+'FortunateMapsStitcher']]},
  {cat:'maps', name:'Tile Grid Trainer', desc:'Map-reading drill with sound cues.', links:[['Open', PG+'OFM-Training/'], ['Code', GH+'OFM-Training']]},
  {cat:'maps', name:'Map Ratings', desc:'Daily likes, dislikes and score for every rated map.', links:[['Open', SHEET('1oW00BDTxzhdsmQhNa-4FVWEbdxXKx1iqu4zuCppVEPE')]]},

  // Stats
  {cat:'stats', name:'TagPro Findings', desc:'What 10,564 ranked replays say about winning.', img:'findings', links:[['Read', GH+'tagpro-findings']]},
  {cat:'stats', name:'Map Size vs Popularity', desc:'Every public game since 2015 vs map shape.', img:'mapanalysis', links:[['Read', GH+'tagpro-map-analysis']]},
  {cat:'stats', name:'Ranked Replay Archive', desc:'Every ranked match, and the saved recordings.', img:'replayarchive', links:[['Open', PG+'tagpro-replay-archive/'], ['Download', PG+'tagpro-replay-archive/download.html'], ['Code', GH+'tagpro-replay-archive']]},
  {cat:'stats', name:'NALTP Archive', desc:'Full history of the NA leagues.', img:'naltp', links:[['Open', PG+'naltp-archive/'], ['Code', GH+'naltp-archive']]},
  {cat:'stats', name:'GLTP', desc:'Gravity map records and leaderboard.', img:'gltp', links:[['Open', PG+'GLTP/'], ['Code', GH+'GLTP']]},
  {cat:'stats', name:'Zomball Stats', desc:'Zomball leaderboard, player pages and API.', links:[['Open', PG+'ZomballStats/'], ['Code', GH+'ZomballStats']]},
  {cat:'stats', name:'Sheets Link Extractor', desc:'Pull every tagpro.eu link out of league sheets.', img:'eufromhub', links:[['Open', PG+'eufromhub/'], ['Code', GH+'eufromhub']]},
  {cat:'stats', name:'Ranked Stats Collector', desc:'Python pipeline for ranked player and map stats.', links:[['Code', GH+'RankedStatsCollector']]},
  {cat:'stats', name:'TagproStats', desc:'Stats tool with a GUI for tagpro.eu matches.', links:[['Code', GH+'TagproStats']]},
  {cat:'stats', name:'tagpro.eu Decoder', desc:'Read tagpro.eu match files in JavaScript.', links:[['Code', GH+'tagpro.eu-data']]},
  {cat:'stats', name:'Public Games', desc:'297k public match summaries, one CSV.', links:[['Download', GH+'PublicGames']]},
  {cat:'stats', name:'Socket API Reference', desc:'Every TagPro socket event, written down.', links:[['Read', GH+'api']]},

  // Spreadsheets
  {cat:'sheets', name:'Ranked Stats', desc:'Every ranked player’s full stat line (Aug 2025).', links:[['Open', SHEET('13lX7jrlbD0H87GYMt8WZt8tssoxQjYJUQ1ofGnSLRYw')]]},
  {cat:'sheets', name:'Ranked Leaderboard', desc:'Ranked leaderboard, Nov 2025.', links:[['Open', SHEET('10FAeWmNfFrUW9Bpdf3D4Ob3w5vuNfC6o_oV2Es9bfAY')]]},
  {cat:'sheets', name:'Elo Movement', desc:'Every player’s skill rating, game by game.', links:[['Open', SHEET('1g9DCFlX9p_57_-QUVYwU7p6u3JuOtFTviTQ-et-YgUo')]]},
  {cat:'sheets', name:'Map Results', desc:'Red and blue win rates on each ranked map.', links:[['Open', SHEET('12u0BJ4sDbjFC9O7dnSirT38pIUIjB51WDqBdXG9H3Us')]]},
  {cat:'sheets', name:'Pups and Caps', desc:'How powerups affect who caps.', links:[['Open', SHEET('1bVCuYHybtVnQNdMUd2ESqUTDdEDJNMYYe1oLUpJGC9w')]]},
  {cat:'sheets', name:'NALTP Match Archive', desc:'19,599 labeled league games.', links:[['Open', SHEET('1i0485AuU760NnOR2FQD7bQUaORkzxcs65QrWQE_4iLM')]]},
  {cat:'sheets', name:'Bambi Scores', desc:'Season scores for every league player.', links:[['Majors', SHEET('1mAbmzM2OghrrWr7oUDcNe2qQkTFKzVhLiYS4gxuOft8')], ['Minors', SHEET('1ZPXxuS5rBAqN9E0N0HonQy_WBGHCApRpP9t9rJEKua8')], ['Novice', SHEET('1bn4k7n1Xt8XAFZGcjnIBOwU2b8QVcqBbHXG8w0-0Ou4')]]},
  {cat:'sheets', name:'Pick/Ban Cheat Sheet', desc:'Each Majors team’s record on every map.', links:[['Open', SHEET('1b7SYDDlHeW0xzuA431HUVEr0Q_gIO5mD1lwSEFmVp2s')]]},
  {cat:'sheets', name:'Power Ranking Collective', desc:'Everyone’s power rankings, season by season.', links:[['Open', SHEET('1R4ntmlIQlhpWCan1kfclO9QC8Hc-4kBLCYO5XlGIWig')]]},
  {cat:'sheets', name:'NALTP Drafts', desc:'Every draft across seasons.', links:[['Open', SHEET('1OFKL_84eF1tuFsf6aMFa1McTsIyXNLGUyqin0-fVDC0')]]},
  {cat:'sheets', name:'Easy Mock Draft', desc:'Run a mock draft.', links:[['Open', SHEET('1ThAEyrZGz1RkmI_GZbOJQ1FjXo9e5gVTuXUDI6t7jSE')]]},
  {cat:'sheets', name:'Auction / Snake Draft', desc:'Draft sheet for auction or snake drafts.', links:[['Open', SHEET('1j2E-PyVkdVL7bLIyHYhTcYq-Wq_djLAkes6STVqnvAw')]]},
  {cat:'sheets', name:'TagPro Wordle', desc:'TagPro Wordle leaderboard.', links:[['Open', SHEET('1EoC_E4olz5GTnhAhfhmOZ-k3JDMnQwi5DZgfisP96Qg')]]},
  {cat:'sheets', name:'Map Count (Sept 2023)', desc:'When every map was approved, promoted and removed.', links:[['Open', SHEET('1aZkt4-209ynS5dqTwmiQD_ks1Feif4Nukr8gFkeJt78')]]},
];

const CATS = {clones:['Clones','🎮','#3a1d22'], bots:['Bots','🤖','#1c2740'], scripts:['Userscripts','📜','#2d2a18'],
              maps:['Map Tools','🗺️','#18302a'], stats:['Stats','📊','#22213a'], sheets:['Spreadsheets','📈','#183028']};
const grid = document.getElementById('grid'), tabs = document.getElementById('tabs'), q = document.getElementById('q');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cat = (location.hash.slice(1) in CATS) ? location.hash.slice(1) : 'all';

function card(p) {
  const [label, icon, color] = CATS[p.cat], main = p.links[0][1];
  const pic = p.img
    ? `<a class="pic" href="${main}"><img src="img/${p.img}.jpg" alt="" loading="lazy"><span class="cat">${label}</span></a>`
    : `<a class="pic gen" href="${main}" style="background:linear-gradient(135deg,${color},#14161c)">${icon}<span class="cat">${label}</span></a>`;
  const btns = p.links.map(([t, u], i) => `<a class="${i === 0 ? 'main' : ''}" href="${u}">${esc(t)}</a>`).join('');
  return `<div class="card">${pic}<div class="body"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.desc)}</div><div class="btns">${btns}</div></div></div>`;
}

function render() {
  const term = q.value.trim().toLowerCase();
  const list = P.filter(p => (cat === 'all' || p.cat === cat) &&
    (!term || (p.name + ' ' + p.desc + ' ' + CATS[p.cat][0]).toLowerCase().includes(term)));
  grid.innerHTML = list.length ? list.map(card).join('') : '<div class="empty">Nothing matches that search.</div>';
  tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.cat === cat));
}

tabs.innerHTML = [['all', 'All', P.length], ...Object.entries(CATS).map(([k, v]) => [k, v[0], P.filter(p => p.cat === k).length])]
  .map(([k, t, n]) => `<button data-cat="${k}">${t}<b>${n}</b></button>`).join('');
tabs.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  cat = b.dataset.cat; history.replaceState(null, '', cat === 'all' ? location.pathname : '#' + cat); render();
});
q.addEventListener('input', render);
render();
</script>
</body>
</html>
